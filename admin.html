@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--bg:#050505;--card:rgba(18,20,28,.82);--pill:rgba(25,27,35,.72);--text:#fff;--muted:#94a3b8;--accent:#0ea5e9;--accentSoft:rgba(14,165,233,.18)}
html[data-theme="light"]{--bg:#f8fafc;--card:rgba(255,255,255,.92);--pill:rgba(255,255,255,.88);--text:#0f172a;--muted:#475569}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:var(--bg);background-image:radial-gradient(circle at top,var(--accentSoft),transparent 45%);background-repeat:no-repeat;background-attachment:fixed;color:var(--text);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:10}
.flex{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--text) 20%,var(--accent) 100%);-webkit-background-clip:text;color:transparent;text-transform:uppercase}
.pill-box{display:flex;gap:6px;padding:4px;border-radius:99px;background:var(--pill);border:1px solid rgba(255,255,255,.08)}
.btn-icon{width:36px;height:36px;border:none;border-radius:50%;background:0 0;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.btn-icon:active{transform:scale(.9)}
.btn-icon.active{background:var(--accent);color:#fff}
.hero{text-align:center;margin:20px 0}
.badge{background:var(--accentSoft);border:1px solid var(--accent);color:var(--accent);padding:6px 16px;border-radius:99px;font-size:10px;letter-spacing:3px;font-weight:800;display:inline-block;margin-bottom:10px}
h1{font-size:32px;line-height:1.2;font-weight:900;letter-spacing:-1px}
.sec{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:20px;margin-bottom:15px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.s-tit{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--muted);margin-bottom:15px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:10px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.input-group input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.input-group input:focus{border-color:var(--accent);background:rgba(255,255,255,.08)}
.input-group input::placeholder{color:var(--muted);opacity:.6}
.btn-save{width:100%;padding:18px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 25px var(--accentSoft);transition:transform .15s,opacity .15s;margin-top:10px}
.btn-save:active{transform:scale(.96);opacity:.9}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#10b981;color:#fff;padding:12px 24px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:all .3s ease;z-index:100;box-shadow:0 5px 15px rgba(16,185,129,.4)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.song-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:10px}
.song-item h3{font-size:14px;margin-bottom:4px;word-break:break-word}
.song-item p{font-size:12px;color:var(--muted);word-break:break-word}
.song-item .meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.song-actions{display:flex;gap:8px}
.btn-mini{border:none;border-radius:12px;padding:10px 12px;color:#fff;cursor:pointer;font-size:12px;font-weight:700}
.btn-del{background:#ef4444}
.btn-use{background:#10b981}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
</style>

};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const songsRef = db.ref('lofi_songs');

function changeTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('thm', t);
  document.querySelector('.top-dark').classList.toggle('active', t === 'dark');
  document.querySelector('.top-light').classList.toggle('active', t === 'light');
}

// Updated with all 25 institute keys
const linkKeys = [
  'link-pw-prime', 'link-pw-node2', 'link-pw-nexus', 'link-next-topper',
  'link-kgs-portal', 'link-unacademy', 'link-vidyakul', 'link-rwa',
  'link-studyiq', 'link-mission-jeet', 'link-selection-next',
  'link-careerwill', 'link-science-fun',
  'link-gyan-bindu', 'link-aash', 'link-winning', 'link-farmar',
  'link-lakshya', 'link-samyak', 'link-kautilya', 'link-apna',
  'link-alpha', 'link-jobs', 'link-cds', 'link-textbook'
];

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function showToast(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}

window.onload = function() {
  changeTheme(localStorage.getItem('thm') || 'dark');

  // Firebase se Links fetch karein
  db.ref('institute_links').once('value').then(s => {
    if(s.exists()){
      const data = s.val();
      linkKeys.forEach(k => { if(data[k]) document.getElementById(k).value = data[k]; });
    }
  });

  // Firebase se 24h Keys fetch karein
  db.ref('institute_keys').once('value').then(s => {
    if(s.exists()){
      const data = s.val();
      linkKeys.forEach(k => { if(data[k]) document.getElementById('key-'+k).value = data[k]; });
    }
  });

  // Firebase se Premium Keys fetch karein
  db.ref('institute_premium_keys').once('value').then(s => {
    if(s.exists()){
      const data = s.val();
      linkKeys.forEach(k => { if(data[k]) document.getElementById('premium-key-'+k).value = data[k]; });
    }
  });

  // Firebase se App Settings fetch karein
  db.ref('app_settings').once('value').then(s => {
    if(s.exists()){
      const data = s.val();
      if(data.generateUrl) document.getElementById('setting-generate-url').value = data.generateUrl;
      if(data.videoUrl) document.getElementById('setting-video-url').value = data.videoUrl;
      
      // Premium Links
      if(data.premiumGenerateUrl) document.getElementById('setting-premium-generate-url').value = data.premiumGenerateUrl;
      if(data.premiumVideoUrl) document.getElementById('setting-premium-video-url').value = data.premiumVideoUrl;
      
      // Social Links
      if(data.telegramUrl) document.getElementById('setting-telegram-url').value = data.telegramUrl;
      if(data.youtubeUrl) document.getElementById('setting-youtube-url').value = data.youtubeUrl;
      if(data.instagramUrl) document.getElementById('setting-instagram-url').value = data.instagramUrl;
    }
  });

  // Local lofi cache
  const lofiTitle = localStorage.getItem('lofi_title');
  const lofiUrl = localStorage.getItem('lofi_url');
  const lofiSource = localStorage.getItem('lofi_source');
  if (lofiTitle) document.getElementById('lofi-title').value = lofiTitle;
  if (lofiUrl) document.getElementById('lofi-url').value = lofiUrl;
  if (lofiSource) document.getElementById('lofi-source').value = lofiSource;

  renderSongHistory();
};

function saveAllSettings() {
  const updates = {};
  const btn = document.querySelector('.btn-save');
  btn.innerHTML = 'Saving...';
  
  // Links aur Keys collect karna
  linkKeys.forEach(k => {
    const linkVal = document.getElementById(k).value.trim();
    const keyVal = document.getElementById('key-'+k).value.trim();
    const premiumKeyVal = document.getElementById('premium-key-'+k).value.trim();
    
    updates[`institute_links/${k}`] = linkVal;
    updates[`institute_keys/${k}`] = keyVal;
    updates[`institute_premium_keys/${k}`] = premiumKeyVal; // Premium key node
  });

  // Global settings collect karna
  updates['app_settings/generateUrl'] = document.getElementById('setting-generate-url').value.trim();
  updates['app_settings/videoUrl'] = document.getElementById('setting-video-url').value.trim();
  
  updates['app_settings/premiumGenerateUrl'] = document.getElementById('setting-premium-generate-url').value.trim();
  updates['app_settings/premiumVideoUrl'] = document.getElementById('setting-premium-video-url').value.trim();

  updates['app_settings/telegramUrl'] = document.getElementById('setting-telegram-url').value.trim();
  updates['app_settings/youtubeUrl'] = document.getElementById('setting-youtube-url').value.trim();
  updates['app_settings/instagramUrl'] = document.getElementById('setting-instagram-url').value.trim();

  // Lofi Settings
  const title = document.getElementById('lofi-title').value.trim();
  const url = document.getElementById('lofi-url').value.trim();
  const source = document.getElementById('lofi-source').value.trim();

  localStorage.setItem('lofi_title', title);
  localStorage.setItem('lofi_url', url);
  localStorage.setItem('lofi_source', source);

  // Agar URL hai toh naya gaana add karo
  if (url) {
    const newSongRef = songsRef.push();
    const song = {
      title: title || 'Untitled Lofi',
      url: url,
      source: source || 'Admin Panel',
      createdAt: Date.now()
    };
    updates[`lofi_songs/${newSongRef.key}`] = song;
  }

  // Final Save to Firebase
  db.ref().update(updates)
    .then(() => {
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save All Settings';
      showToast('Settings Updated Successfully! 🎉');
      renderSongHistory();
    })
    .catch((err) => {
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save All Settings';
      alert('Firebase save failed: ' + err.message);
    });
}

function renderSongHistory() {
  songsRef.orderByChild('createdAt').on('value', snap => {
    const box = document.getElementById('song-list');
    box.innerHTML = '';
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id, s]) => ({id, ...s})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if (!arr.length) {
      box.innerHTML = '<div class="empty">No songs saved yet.</div>';
      return;
    }
    arr.forEach(song => {
      const div = document.createElement('div');
      div.className = 'song-item';
      div.innerHTML = `
        <h3>${esc(song.title)}</h3>
        <p>${esc(song.source)}</p>
        <p style="margin-top:6px;color:var(--text)">${esc(song.url)}</p>
        <div class="meta">
          <span style="font-size:12px;color:var(--muted)">${song.createdAt ? new Date(song.createdAt).toLocaleString() : ''}</span>
          <div class="song-actions">
            <button class="btn-mini btn-use" onclick="useSong('${song.id}')">Use</button>
            <button class="btn-mini btn-del" onclick="deleteSong('${song.id}')">Delete</button>
          </div>
        </div>`;
      box.appendChild(div);
    });
  });
}

function useSong(id){
  songsRef.child(id).once('value').then(s=>{
    const song=s.val();
    if(!song) return;
    document.getElementById('lofi-title').value = song.title || '';
    document.getElementById('lofi-url').value = song.url || '';
    document.getElementById('lofi-source').value = song.source || '';
    showToast('Song loaded into inputs');
  });
}

function deleteSong(id){
  if(!confirm('Delete this song from history?')) return;
  songsRef.child(id).remove().then(()=>{
    showToast('Song deleted');
  });
}
</script>
</body>
